services:
  - type: web
    name: prime-app-1
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
