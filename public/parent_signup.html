<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Registration - Prime Tuitions / Solutions</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .vibrant-bg {
            background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 85% 75%, rgba(59, 130, 246, 0.1) 0%, transparent 45%),
                        linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body class="vibrant-bg text-slate-800 font-sans min-h-screen flex flex-col justify-between py-10 px-4">

    <!-- Top Navigation / Back Button -->
    <div class="max-w-xl mx-auto w-full mb-6">
        <a href="sign-up2.html" class="inline-flex items-center space-x-2 text-xs font-bold text-blue-600 hover:text-blue-800 transition-colors bg-white/80 px-4 py-2 rounded-xl shadow-sm border border-slate-200">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Portal Selection</span>
        </a>
    </div>

    <!-- Main Form Container -->
    <main class="max-w-xl mx-auto w-full">
        <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-2xl border-t-4 border-t-blue-600">
            
            <!-- Header Branding -->
            <div class="flex items-center space-x-4 mb-6 pb-6 border-b border-slate-200">
                <div class="h-14 w-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-500 text-white flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Parent Portal Sign-Up</h2>
                    <p class="text-xs text-slate-500 font-medium">Register to find and manage verified home tutors.</p>
                </div>
            </div>

            <!-- Parent Registration Form -->
            <form id="parentSignupForm" class="space-y-4" onsubmit="handleParentSubmit(event)">
                
                <!-- Dynamic Form Container: Auto-layouts fields configured by Admin -->
                <div id="dynamicFieldsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Fields injected automatically via JavaScript -->
                </div>

                <!-- Child's Class Selection -->
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Child's Class *</label>
                    <select id="pClass" required class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm text-slate-700" onchange="onClassChange()">
                        <option value="">Select Class</option>
                        <option value="lower">Nursery - UKG (Pre-Primary)</option>
                        <option value="lower">1ˢᵗ - 5ᵗʰ (Primary)</option>
                        <option value="lower">6ᵗʰ - 8ᵗʰ (Middle School)</option>
                        <option value="lower">9ᵗʰ - 10ᵗʰ (Secondary Board)</option>
                        <option value="senior">11ᵗʰ - 12ᵗʰ (Senior Secondary)</option>
                    </select>
                </div>

                <!-- Subjects Selection Container -->
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Subjects Needed (Select Multiple) *</label>
                    <div id="pSubjectsContainer" class="p-4 bg-slate-100 border border-slate-300 rounded-xl text-sm text-slate-400">
                        Please select a child's class first.
                    </div>
                </div>

                <!-- Conditional Free Text Field for "Others" Subject -->
                <div id="pSubjectsOtherContainer" class="hidden">
                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Please Specify Subject *</label>
                    <input type="text" id="pSubjectsOther" placeholder="Enter custom subject name" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm" oninput="validateParentForm()">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Preferred Time Slot -->
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider">Preferred Time</label>
                            <span class="text-[10px] text-slate-400 font-bold uppercase">(Optional)</span>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            <div class="relative flex-1">
                                <select id="pTimeHour" class="w-full pl-1 pr-8 py-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm appearance-none" onchange="updatePreferredTimeValue()">
                                    <option value="">HH</option>
                                    <option value="01">01</option>
                                    <option value="02">02</option>
                                    <option value="03">03</option>
                                    <option value="04">04</option>
                                    <option value="05">05</option>
                                    <option value="06">06</option>
                                    <option value="07">07</option>
                                    <option value="08">08</option>
                                    <option value="09">09</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 pointer-events-none text-xs">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </span>
                            </div>

                            <span class="font-bold text-slate-400 text-sm">:</span>

                            <div class="relative flex-1">
                                <select id="pTimeMinute" class="w-full pl-1 pr-3 py-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm appearance-none" onchange="updatePreferredTimeValue()">
                                    <option value="">MM</option>
                                    <option value="00">00</option>
                                    <option value="15">15</option>
                                    <option value="30">30</option>
                                    <option value="45">45</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 pointer-events-none text-xs">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </span>
                            </div>

                            <div class="relative w-24">
                                <select id="pTimePeriod" class="w-full pl-3 pr-8 py-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm appearance-none" onchange="updatePreferredTimeValue()">
                                    <option value="PM">PM</option>
                                    <option value="AM">AM</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 pointer-events-none text-xs">
                                    <i class="fa-solid fa-clock text-blue-600"></i>
                                </span>
                            </div>
                        </div>

                        <input type="hidden" id="pTime" name="preferred_time" value="">
                    </div>

                    <!-- Preferred Budget -->
                    <div>
                        <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Preferred Budget *</label>
                        <select id="pBudget" required class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm text-slate-700" onchange="validateParentForm()">
                            <option value="">Select Budget Range</option>
                            <option>₹3,000 - ₹5,000 / mo</option>
                            <option>₹5,000 - ₹8,000 / mo</option>
                            <option>₹8,000 - ₹12,000 / mo</option>
                            <option>₹12,000+ / mo</option>
                        </select>
                    </div>
                </div>

                <!-- Password Creation -->
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Create Password *</label>
                    <div class="relative">
                        <input type="password" id="pPassword" required placeholder="••••••••" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm pr-12" oninput="validateParentForm()">
                        <button type="button" onclick="togglePassword('pPassword', 'eyeIconP')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i id="eyeIconP" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p id="pPasswordError" class="text-[11px] text-slate-400 mt-1">Must be min 8 chars, include letters, numbers & special character.</p>
                </div>

                <button type="submit" id="pSubmitBtn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-blue-500/20 mt-2">
                    Complete Sign-Up & Enter Dashboard
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500">
        &copy; 2026 Prime Tuitions / Solutions. Secure Parent Portal.
    </footer>

    <!-- Schema Engine & Dynamic Rendering Script -->
    <script>
        // Baseline Parent Form Schema Fallback
        const defaultParentSchema = [
            { id: "pName", label: "Full Name", type: "text", placeholder: "e.g. Ramesh Sharma", required: true, width: "full" },
            { id: "pPhone", label: "Phone Number", type: "tel", placeholder: "+91 9876543210", required: true, width: "half", errorId: "phoneError", defaultErrorText: "10-digit mobile number" },
            { id: "pEmail", label: "Email ID", type: "email", placeholder: "e.g. parent@example.com", required: true, width: "half", errorId: "emailError", defaultErrorText: "Valid email format" },
            { id: "pLocation", label: "Area / Location", type: "text", placeholder: "e.g. Sector 62, Noida", required: true, width: "full" }
        ];

        function renderDynamicParentFields() {
            const container = document.getElementById('dynamicFieldsContainer');
            const storedSchema = localStorage.getItem('parent_signup_schema');
            const fields = storedSchema ? JSON.parse(storedSchema) : defaultParentSchema;

            container.innerHTML = '';

            fields.forEach((field, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = field.width === 'full' ? 'sm:col-span-2' : 'sm:col-span-1';

                let helperHTML = field.errorId ? `<p id="${field.errorId}" class="text-[10px] text-slate-400 mt-1">${field.defaultErrorText || ''}</p>` : '';

                wrapper.innerHTML = `
                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">
                        ${index + 1}. ${field.label} ${field.required ? '*' : ''}
                    </label>
                    <input type="${field.type}" 
                           id="${field.id}" 
                           ${field.required ? 'required' : ''} 
                           placeholder="${field.placeholder || ''}" 
                           class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-sm" 
                           oninput="validateParentForm()">
                    ${helperHTML}
                `;
                container.appendChild(wrapper);
            });
        }

        // Subject lists
        const subjectsLower = ["Hindi", "English", "Maths", "Science", "SST", "Computer", "All Subjects", "Others"];
        const subjectsSenior = ["Physics", "Maths", "Chemistry", "Biology", "Accounts", "Economics", "Humanities", "Computer Science", "Others"];

        function onClassChange() {
            const classSelect = document.getElementById('pClass');
            const container = document.getElementById('pSubjectsContainer');
            const otherContainer = document.getElementById('pSubjectsOtherContainer');
            const otherInput = document.getElementById('pSubjectsOther');

            const selectedType = classSelect.value;
            otherContainer.classList.add('hidden');
            otherInput.value = '';
            otherInput.required = false;
            container.innerHTML = '';

            if (!selectedType) {
                container.innerHTML = '<span class="text-slate-400">Please select a child\'s class first.</span>';
                container.className = "p-4 bg-slate-100 border border-slate-300 rounded-xl text-sm text-slate-400";
            } else {
                container.className = "p-4 bg-white border border-slate-300 rounded-xl text-sm text-slate-700 shadow-sm";
                let list = (selectedType === 'senior') ? subjectsSenior : subjectsLower;

                const gridDiv = document.createElement('div');
                gridDiv.className = "grid grid-cols-2 gap-2.5 w-full";

                list.forEach((sub, index) => {
                    const label = document.createElement('label');
                    label.className = "flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer hover:text-blue-600 p-1.5 rounded-lg hover:bg-slate-50 transition-colors";
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'pSubjectCheckbox';
                    checkbox.value = sub;
                    checkbox.id = `sub_${index}`;
                    checkbox.className = "rounded border-slate-300 text-blue-600 focus:ring-blue-500 h-4 w-4";
                    checkbox.onchange = function() {
                        handleCheckboxChange();
                        validateParentForm();
                    };

                    const span = document.createElement('span');
                    span.textContent = sub;

                    label.appendChild(checkbox);
                    label.appendChild(span);
                    gridDiv.appendChild(label);
                });

                container.appendChild(gridDiv);
            }

            validateParentForm();
        }

        function handleCheckboxChange() {
            const checkboxes = document.querySelectorAll('input[name="pSubjectCheckbox"]');
            const otherContainer = document.getElementById('pSubjectsOtherContainer');
            const otherInput = document.getElementById('pSubjectsOther');

            let isOthersChecked = Array.from(checkboxes).some(cb => cb.value === 'Others' && cb.checked);

            if (isOthersChecked) {
                otherContainer.classList.remove('hidden');
                otherInput.required = true;
            } else {
                otherContainer.classList.add('hidden');
                otherInput.required = false;
                otherInput.value = '';
            }
        }

        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePhone(phone) {
            return /^(\+91[\-\s]?)?[6-9]\d{9}$/.test(phone);
        }

        function validatePassword(password) {
            return /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(password);
        }

        function updatePreferredTimeValue() {
            const hour = document.getElementById('pTimeHour').value;
            const minute = document.getElementById('pTimeMinute').value;
            const period = document.getElementById('pTimePeriod').value;
            const hiddenTimeInput = document.getElementById('pTime');

            hiddenTimeInput.value = (hour && minute) ? `${hour}:${minute} ${period}` : '';
            validateParentForm();
        }

        function validateParentForm() {
            const nameEl = document.getElementById('pName');
            const phoneEl = document.getElementById('pPhone');
            const emailEl = document.getElementById('pEmail');
            const locationEl = document.getElementById('pLocation');

            const name = nameEl ? nameEl.value.trim() : 'Valid';
            const phone = phoneEl ? phoneEl.value.trim() : '';
            const email = emailEl ? emailEl.value.trim() : '';
            const location = locationEl ? locationEl.value.trim() : 'Valid';

            const cls = document.getElementById('pClass').value;
            const budget = document.getElementById('pBudget').value;
            const password = document.getElementById('pPassword').value;

            const phoneErr = document.getElementById('phoneError');
            const emailErr = document.getElementById('emailError');
            const passError = document.getElementById('pPasswordError');
            const submitBtn = document.getElementById('pSubmitBtn');

            const isPhoneValid = phoneEl ? validatePhone(phone) : true;
            const isEmailValid = emailEl ? validateEmail(email) : true;
            const isPassValid = validatePassword(password);

            if (phoneEl && phoneErr) {
                if (phone.length > 0) {
                    phoneErr.className = isPhoneValid ? "text-[10px] text-emerald-600 mt-1" : "text-[10px] text-rose-500 mt-1";
                    phoneErr.innerText = isPhoneValid ? "Valid phone number format." : "Enter valid 10-digit mobile number.";
                } else {
                    phoneErr.className = "text-[10px] text-slate-400 mt-1";
                    phoneErr.innerText = "10-digit mobile number";
                }
            }

            if (emailEl && emailErr) {
                if (email.length > 0) {
                    emailErr.className = isEmailValid ? "text-[10px] text-emerald-600 mt-1" : "text-[10px] text-rose-500 mt-1";
                    emailErr.innerText = isEmailValid ? "Valid email format." : "Enter a valid email address.";
                } else {
                    emailErr.className = "text-[10px] text-slate-400 mt-1";
                    emailErr.innerText = "Valid email format";
                }
            }

            if (password.length > 0) {
                passError.className = isPassValid ? "text-[11px] text-emerald-600 mt-1" : "text-[11px] text-rose-500 mt-1";
                passError.innerText = isPassValid ? "Password criteria met successfully!" : "Password must be min 8 chars with letters, numbers & special character.";
            } else {
                passError.className = "text-[11px] text-slate-400 mt-1";
                passError.innerText = "Must be min 8 chars, include letters, numbers & special character.";
            }

            const checkedSubjects = document.querySelectorAll('input[name="pSubjectCheckbox"]:checked');
            const isSubjectSelected = checkedSubjects.length > 0;
            let isOthersChecked = Array.from(checkedSubjects).some(cb => cb.value === 'Others');
            let isOthersValid = !isOthersChecked || document.getElementById('pSubjectsOther').value.trim().length > 0;

            const requiredFilled = name && isPhoneValid && isEmailValid && location && cls && isSubjectSelected && isOthersValid && budget && isPassValid;

            if (requiredFilled) {
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        function handleParentSubmit(event) {
            event.preventDefault();
            alert('Registration successful!!');
        }

        // Initialize on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            renderDynamicParentFields();
        });
    </script>
</body>
</html>
